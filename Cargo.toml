[package]
name = "dup-detector"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ignore = "0.4.33"
libloading = "0.9"
memmap2 = "0.9.11"
rayon = "1.12.0"
rmcp = { version = "3.5.1", features = ["transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tower-lsp = "0.20.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-language = "0.1.9"
tree-sitter-cpp = "0.23.4"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
criterion = "0.8.2"
tree-sitter-go = "0.25"

[[bench]]
name = "hot_paths"
harness = false

